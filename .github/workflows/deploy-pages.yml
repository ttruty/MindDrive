name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false

      # Base href is derived from the repo name (/<repo>/). For a custom domain, set the repository
      # variable PAGES_BASE_HREF to "/" (Settings → Secrets and variables → Actions → Variables).
      # GOOGLE_API_KEY (repository secret) enables shared links without sign-in. It's baked into the
      # public bundle — Google Cloud restrictions (Drive API only, your site's referrers) protect it;
      # the secret just keeps it out of git. Missing secret = feature off, build still succeeds.
      - run: npm run build:pages
        env:
          PAGES_BASE_HREF: ${{ vars.PAGES_BASE_HREF }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
