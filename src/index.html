<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8"/>
  <title>MindDrive</title>
  <meta name="description" content="Calm, personal meditation sessions from your Google Drive."/>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf8f4"/>
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16151d"/>

  <base href="/"/>

  <meta name="color-scheme" content="light dark"/>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>

  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png"/>

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="MindDrive"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Warm up connections used right after launch (sign-in + Drive API). -->
  <link rel="preconnect" href="https://accounts.google.com"/>
  <link rel="preconnect" href="https://www.googleapis.com"/>

  <!-- Match the theme before CSS loads so dark mode doesn't flash white. -->
  <style>
    html { background: #fbf8f4; }
    @media (prefers-color-scheme: dark) { html { background: #16151d; } }
    .md-noscript { font: 16px/1.5 system-ui, sans-serif; color: #6e6880; text-align: center; padding: 4rem 1.5rem; }
  </style>
</head>

<body>
  <app-root></app-root>
  <noscript><p class="md-noscript">MindDrive needs JavaScript to run. Please enable it and reload.</p></noscript>
</body>

</html>
