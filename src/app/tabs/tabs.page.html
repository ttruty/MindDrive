<!-- Relative hrefs (resolved against <base href>) so the app also works under a subpath, e.g. GitHub Pages. -->
<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" href="tabs/home">
      <ion-icon aria-hidden="true" name="leaf"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="explore" href="tabs/explore">
      <ion-icon aria-hidden="true" name="compass"></ion-icon>
      <ion-label>Explore</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="downloads" href="tabs/downloads">
      <ion-icon aria-hidden="true" name="cloud-download"></ion-icon>
      <ion-label>Downloads</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="settings" href="tabs/settings">
      <ion-icon aria-hidden="true" name="options"></ion-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
