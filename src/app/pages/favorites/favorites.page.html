<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Favorites</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (items.value(); as list) {
    @if (list.nodes.length) {
      <app-session-list
        class="md-section favorites-list"
        [sessions]="list.nodes"
        (sessionSelect)="openSession($event)"
      ></app-session-list>
    } @else {
      <section class="md-placeholder">
        <div class="md-placeholder__orb"><ion-icon name="heart-outline" aria-hidden="true"></ion-icon></div>
        <h2>No favorites yet</h2>
        <p>Tap the heart on any session to keep it close at hand.</p>
        <ion-button shape="round" class="md-placeholder__action" routerLink="/tabs/explore">Explore sessions</ion-button>
      </section>
    }
  } @else if (items.error()) {
    <app-load-error (retry)="items.reload()"></app-load-error>
  } @else {
    <div class="md-center"><ion-spinner name="crescent"></ion-spinner></div>
  }
</ion-content>
